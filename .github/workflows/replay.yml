name: replay

on:
  push:
  pull_request:

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./functions/ ./cmd/...
      - run: go test ./functions/ -race -count=1
      - run: go run ./cmd/refplatform
